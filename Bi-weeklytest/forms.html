<!DOCTYPE html>
<html>
<head>

</head>
<body>
  <h1>Event Registration Form</h1>
  <p>This form showcases raw HTML input types without any CSS styling applied.</p>

  <form>
    <fieldset>
      <legend>Personal Details(Text Inputs)</legend>
        <label for="name">Full Name(Required):</label>
          <input placeholder="John doe">
          <br>
          <br>
          <label for="email">Email Address:</label>
          <input placeholder="example@gmail.com" type="email">
          <br>
          <br>
          <label for="ph no">Phone Number:</label>
          <input placeholder="1234-5678-98" type="tel">
          <br>
          <br>
          <label for="create pass">Create a passcode:</label>
          <input type="password">
    </fieldset>
  </form>

  <form>
    <fieldset>
      <legend>Attendance Preferences (Selection Inputs)</legend>
      <label for="ticket">Ticket type:</label>
      <input type="">
      <br>
      <br>
      <label for="learning track">Choose your main learning track:</label><br>
      <input type="radio">Web Development<br>
      <input type="radio">Data Science<br>
      <input type="radio">UI/UX design<br>
      <br>
      <label for="main learning track">Dietary Requirements (Select all that apply):</label><br>
      <input type="checkbox">Vegetarian<br>
      <input type="checkbox">Vegan<br>
      <input type="checkbox">Gluten-Free<br>
    </fieldset>
  </form>

  <form>
    <fieldset>
      <legend>Scheduling & Logistics (Advanced Inputs)</legend> 
      <label for="Guest">Additional Guests:</label>
      <input type="number">
      <br>
      <br>
      <label for="date">Arrival Date:</label>
      <input type="date">
      <br>
      <br>
      <label for="time">Estimated Arrival Time:</label>
      <input type="time">
      <br>
      <br>
      <label for="level">Your Current Coding Comfort Level (1-10):</label><br>
      <input type="range">

      <br>
      <label for="color">Preferred T-Shirt Color:</label>
      <input type="color">
      <br>
      <label for="link">Portfolio Link:</label>
      <input type="url" placeholder="https://example.com">
      <br>
      <br>
       <label for="id1">Upload Student ID (PDF or Image):</label>
       <input type="file">
       <br>
       <br>
       <label for="question">Any special accommodations or questions?</label>
       <textarea>
        Type your messege here...
       </textarea>
        <button type="button">Submit Registration</button>
        <button type="button">Clear form</button>
    </fieldset>
  </form>  
</body>
</html>
