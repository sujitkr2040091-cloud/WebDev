<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            position: relative ;
            border: 1px solid black;
            height: 500px;
            width: 500px;
        }
        .box span{
            position: absolute;
            
        }
        .top-left {
            top: 0px;
            left: 0px;
        }
        .top-right {
            top: 0;
            right: 0;
        }
        .bottom-left {
            bottom: 0px;
            left: 0px;
        }
        .bottom-right {
            bottom: 0px;
            right: 0px;
        }
    </style>
</head>
<body>
<div class="box">
    <span class="name top-left">Sujit</span>
    <span class="name top-right">Sujit</span>
    <span class="name bottom-left">Sujit</span>
    <span class="name bottom-right">Sujit</span>
</div>
    
</body>
</html>
