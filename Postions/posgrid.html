<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .box{
        display: grid;
        border: 1px solid black;
        height: 600px;
        width: 600px;
        padding: 10px;
        grid-row-gap:    20px;
        grid-column-gap: 5rem;  
    }
    .items1{
        border: 1px solid black;
        width: 100px;
        height: 200px;
        top: 0px;
        left: 0px;
    }
    .items2{
        border: 1px solid black;
        width: 100px;
        height: 200px;
        top: 0px;
        right: 0px;
    }
    .items3{
        border: 1px solid black;
        width: 100px;
        height: 200px;
        bottom: 0px;
        left: 0px;
    }
    .items4{
        border: 1px solid black;
        width: 100px;
        height: 200px;
        bottom: 0px;
        right: 0px;
    }
</style>
<body>
    <div class="box">
        <div class="items1">1</div>
        <div class="items2">2</div>
        <div class="items3">3</div>
        <div class="items4">4</div>
    </div>
</body>
</html>
