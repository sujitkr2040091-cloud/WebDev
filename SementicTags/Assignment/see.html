<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      position: relative;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .name {
      position: absolute;
      z-index: 1;
      color: white;
      font-size: 70px;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.5);
      padding: 8px 14px;
    }

    .top-left     { top: 15px;    left: 15px;  }
    .top-right    { top: 15px;    right: 15px; }
    .bottom-left  { bottom: 15px; left: 15px;  }
    .bottom-right { bottom: 15px; right: 15px; }
    .center { top:45%; left:45%; }
    .top-center { top:15px; left:45%;}
    .bottom-center { bottom:15px; left:45%;}
    .left-center { left:15px; top:45%;}
    .right-center { right:15px; top:45%;}
  </style>

</head>
<body>

     <img src="me2.JPG">


  <div class="name top-left">Sujit kumar</div>
  <div class="name top-right">Sujit kumar</div>
  <div class="name bottom-left">Sujit kumar</div>
  <div class="name bottom-right">Sujit kumar</div>
  <div class="name center">Sujit kumar</div>
  <div class="name top-center">Sujit kumar</div>
  <div class="name bottom-center">Sujit kumar</div>
  <div class="name left-center">Sujit kumar</div>
  <div class="name right-center">Sujit kumar</div>

    
</body>
</html>
